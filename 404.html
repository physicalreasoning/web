<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>404 · Physical Reasoning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    color-scheme: light only;
    --ink: #000000;
    --muted: #6B6B6B;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  body {
    font-family: var(--serif);
    background: #FFFFFF;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .code { font-family: var(--mono); font-size: 2.4rem; font-weight: 600; }
  p { margin-top: 1rem; color: var(--muted); }
  a {
    display: inline-block;
    margin-top: 2rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 2px;
  }
  a:hover { color: var(--muted); border-color: var(--muted); }
</style>
</head>
<body>
<div>
  <div class="code">[404]</div>
  <p>This page is beyond the model's horizon.</p>
  <a href="/">Back to the world &rarr;</a>
</div>
</body>
</html>
